name: CN portable tests

on:
  push:
    branches: [cn-dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cn-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      FGO_RUN_LOCAL_INTEGRATION: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c tools/ci-constraints.txt
      - name: Portable unit tests (local integration checks explicitly skipped)
        run: python -m unittest discover -s tools -p "test_*.py"
